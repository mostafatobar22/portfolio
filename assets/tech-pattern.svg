<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <g fill="none" stroke="#7c8aa0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">

    <!-- code brackets </> -->
    <g transform="translate(22,26)">
      <polyline points="10 4 0 14 10 24"></polyline>
      <polyline points="26 4 36 14 26 24"></polyline>
    </g>

    <!-- IC / chip with pins -->
    <g transform="translate(150,18)">
      <rect x="6" y="6" width="30" height="30" rx="3"></rect>
      <line x1="0" y1="14" x2="6" y2="14"></line>
      <line x1="0" y1="28" x2="6" y2="28"></line>
      <line x1="36" y1="14" x2="42" y2="14"></line>
      <line x1="36" y1="28" x2="42" y2="28"></line>
      <line x1="14" y1="0" x2="14" y2="6"></line>
      <line x1="28" y1="0" x2="28" y2="6"></line>
      <line x1="14" y1="36" x2="14" y2="42"></line>
      <line x1="28" y1="36" x2="28" y2="42"></line>
    </g>

    <!-- circuit trace with via pads -->
    <g transform="translate(66,70)">
      <polyline points="0 40 0 10 34 10 34 0"></polyline>
      <rect x="-3" y="37" width="6" height="6"></rect>
      <rect x="31" y="-3" width="6" height="6"></rect>
    </g>

    <!-- AI node-trio -->
    <g transform="translate(150,96)">
      <line x1="14" y1="0" x2="0" y2="24"></line>
      <line x1="14" y1="0" x2="28" y2="24"></line>
      <line x1="0" y1="24" x2="28" y2="24"></line>
      <circle cx="14" cy="0" r="2.6" fill="#7c8aa0" stroke="none"></circle>
      <circle cx="0" cy="24" r="2.6" fill="#7c8aa0" stroke="none"></circle>
      <circle cx="28" cy="24" r="2.6" fill="#7c8aa0" stroke="none"></circle>
    </g>

    <!-- small car silhouette -->
    <g transform="translate(30,150)">
      <rect x="0" y="12" width="46" height="14" rx="5"></rect>
      <path d="M8 12 L13 2 H33 L38 12"></path>
      <circle cx="10" cy="26" r="4.5"></circle>
      <circle cx="36" cy="26" r="4.5"></circle>
    </g>

    <!-- gear -->
    <g transform="translate(178,170)">
      <circle cx="0" cy="0" r="11"></circle>
      <circle cx="0" cy="0" r="4"></circle>
      <line x1="0" y1="-16" x2="0" y2="-11"></line>
      <line x1="0" y1="11" x2="0" y2="16"></line>
      <line x1="-16" y1="0" x2="-11" y2="0"></line>
      <line x1="11" y1="0" x2="16" y2="0"></line>
      <line x1="-11.3" y1="-11.3" x2="-7.8" y2="-7.8"></line>
      <line x1="7.8" y1="7.8" x2="11.3" y2="11.3"></line>
      <line x1="11.3" y1="-11.3" x2="7.8" y2="-7.8"></line>
      <line x1="-7.8" y1="7.8" x2="-11.3" y2="11.3"></line>
    </g>

    <!-- binary readout -->
    <text x="96" y="200" font-family="monospace" font-size="15" fill="#7c8aa0" stroke="none" letter-spacing="1">01 10</text>

  </g>
</svg>
